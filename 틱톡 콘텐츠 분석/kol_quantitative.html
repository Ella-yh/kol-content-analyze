<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정량 분석 · KOL Content Analyze</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f7f8ff;--white:#fff;--navy:#1a1a40;--sub:#666688;
  --accent:#5c6bc0;--border:#e8eaf0;--radius:12px;
}
body{font-family:-apple-system,'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--navy);min-height:100vh;}

/* ── 헤더 ── */
.header{background:var(--white);border-bottom:1px solid var(--border);padding:0 24px;position:sticky;top:0;z-index:200;}
.header-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:52px;padding:8px 0 0;}
.qtabs{display:flex;gap:4px;padding:6px 0 8px;}
.qtab-btn{padding:6px 16px;border-radius:7px;border:1px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;background:#f5f6fa;color:#666;transition:all .15s;}
.qtab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.qtab-content{display:none;}.qtab-content.active{display:block;}
.header h1{font-size:15px;font-weight:700;}
.hbtn{display:inline-flex;align-items:center;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;padding:5px 12px;border-radius:7px;background:#f0f1f7;transition:background .15s;white-space:nowrap;border:none;cursor:pointer;}
.hbtn:hover{background:#e3e5f0;}
.badge{margin-left:auto;background:rgba(92,107,192,.12);color:var(--accent);font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;}

.main{padding:18px 24px;}

/* ── 조건값 설정 (한 줄) ── */
.filter-bar{
  background:var(--white);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 16px;margin-bottom:14px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.fb-title{font-size:13px;font-weight:700;color:var(--navy);white-space:nowrap;padding-right:6px;border-right:1px solid var(--border);}
.fb-group{display:flex;align-items:center;gap:5px;white-space:nowrap;}
.fb-label{font-size:12px;color:var(--sub);font-weight:600;}
.fb-input{
  width:72px;border:1px solid var(--border);border-radius:6px;
  font-size:12px;padding:4px 7px;color:var(--navy);outline:none;
  transition:border-color .15s;text-align:right;
  -moz-appearance:textfield;
}
.fb-input::-webkit-outer-spin-button,.fb-input::-webkit-inner-spin-button{-webkit-appearance:none;}
.fb-input:focus{border-color:var(--accent);}
.fb-unit{font-size:12px;color:#aaa;}
.fb-sep{font-size:12px;color:#ccc;padding:0 1px;}
.fb-divider{width:1px;height:22px;background:var(--border);margin:0 4px;}

.fb-active{display:none;font-size:11px;font-weight:700;background:#e8f5e9;color:#2e7d32;padding:2px 8px;border-radius:99px;}
.fb-active.on{display:inline-flex;align-items:center;}

button{padding:7px 13px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;}
.btn-accent{background:var(--accent);color:#fff;padding:6px 14px;}
.btn-accent:hover{background:#4a5ab0;}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--sub);padding:5px 10px;font-size:12px;}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-secondary{background:#f0f1f7;color:#444;}
.btn-secondary:hover{background:#e3e5f0;}
.btn-danger{background:#fce4ec;color:#c62828;}
.btn-danger:hover{background:#f8d0de;}
.btn-success{background:#e8f5e9;color:#2e7d32;}
.btn-success:hover{background:#d0edd2;}

/* ── 통계 카드 ── */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:12px;margin-bottom:16px;
}
@media(max-width:900px){.stats-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:560px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px 12px;}
.stat-card .lbl{font-size:11px;color:var(--sub);margin-bottom:5px;font-weight:500;}
.stat-card .val{font-size:18px;font-weight:800;letter-spacing:-.4px;color:var(--navy);}
.stat-card .sub{font-size:10px;color:#aaa;margin-top:2px;}

/* ── 툴바 ── */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.toolbar-left{display:flex;gap:8px;flex-wrap:wrap;flex:1;}
.filter-box{padding:7px 11px;border:1px solid var(--border);border-radius:7px;font-size:13px;color:var(--navy);outline:none;transition:border-color .15s;}
.filter-box:focus{border-color:var(--accent);}

/* ── 컬럼 피커 ── */
.col-picker{position:relative;}
.col-picker-btn{display:inline-flex;align-items:center;gap:5px;background:var(--white);border:1px solid var(--border);color:var(--navy);font-size:13px;font-weight:600;padding:7px 13px;border-radius:7px;cursor:pointer;transition:border-color .15s;}
.col-picker-btn:hover{border-color:var(--accent);}
.col-picker-btn .arr{font-size:10px;color:#888;transition:transform .15s;}
.col-picker-btn.open .arr{transform:rotate(180deg);}
.col-dropdown{display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--white);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.1);padding:10px;min-width:185px;z-index:300;}
.col-dropdown.open{display:block;}
.col-dd-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:8px;font-size:12px;font-weight:600;color:var(--sub);}
.col-dd-head span{cursor:pointer;color:var(--accent);}
.col-dd-head span:hover{text-decoration:underline;}
.col-item{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:6px;cursor:pointer;font-size:13px;transition:background .1s;}
.col-item:hover{background:#f5f6fa;}
.col-item input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;cursor:pointer;}

/* ── 배치 바 ── */
.batch-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.batch-chip{display:inline-flex;align-items:center;gap:5px;background:var(--white);border:1px solid var(--border);border-radius:99px;padding:3px 10px;font-size:11px;color:var(--sub);white-space:nowrap;}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
.dot-v1{background:#5c6bc0;}.dot-v2{background:#7c4dff;}

/* ── 테이블 ── */
.table-section{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.table-wrap{overflow-x:auto;}
table{border-collapse:collapse;font-size:12px;table-layout:fixed;width:100%;min-width:1100px;}
thead th{
  background:#f5f6fa;border-bottom:2px solid var(--border);
  padding:7px 7px;text-align:left;font-weight:600;color:#444;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  cursor:pointer;user-select:none;
}
thead th:hover{background:#eeeff6;}
.si{margin-left:2px;color:#bbb;font-size:9px;}
th.asc .si::after{content:'▲';color:var(--accent);}
th.desc .si::after{content:'▼';color:var(--accent);}
th:not(.asc):not(.desc) .si::after{content:'↕';}
th.no-sort{cursor:default;}th.no-sort:hover{background:#f5f6fa;}
tbody tr{border-bottom:1px solid #f0f1f7;}
tbody tr:hover{background:#fafbff;}
tbody td{padding:6px 7px;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* 컬럼 너비 고정 */
[data-col="platform"]{width:68px;text-align:center;}
[data-col="brand"]   {width:76px;}
[data-col="handle"]  {width:108px;}
[data-col="url"]     {width:58px;text-align:center;}
[data-col="caption"] {width:160px;}
[data-col="date"]    {width:100px;color:#555;}
[data-col="country"] {width:66px;}
[data-col="views"]   {width:66px;text-align:right;}
[data-col="likes"]   {width:60px;text-align:right;}
[data-col="comments"]{width:48px;text-align:right;}
[data-col="shares"]  {width:48px;text-align:right;}
[data-col="saves"]   {width:56px;text-align:right;}
[data-col="erL"]     {width:70px;text-align:right;}
[data-col="erC"]     {width:62px;text-align:right;}
[data-col="erS"]     {width:62px;text-align:right;}
[data-col="erB"]     {width:62px;text-align:right;}
[data-col="promo"]   {width:64px;text-align:center;}
[data-col="_del"]    {width:28px;text-align:center;}

.num{font-variant-numeric:tabular-nums;text-align:right;}
.er-hi{color:#2e7d32;font-weight:700;}.er-mid{color:#e65100;}.er-lo{color:#999;}
.promo-y{display:inline-block;padding:1px 6px;border-radius:99px;font-size:10px;font-weight:700;background:#e3f2fd;color:#1565c0;}
.promo-n{color:#ccc;font-size:11px;}
.caption-cell{cursor:help;}
.handle{color:var(--accent);}
a.vlink{color:var(--accent);font-size:11px;text-decoration:none;}
a.vlink:hover{text-decoration:underline;}
.del-btn{background:none;border:none;color:#ccc;font-size:12px;cursor:pointer;padding:1px 4px;border-radius:4px;}
.del-btn:hover{color:#e53935;}
.col-hidden{display:none!important;}

.empty{padding:56px 24px;text-align:center;color:#bbb;}
.empty .icon{font-size:36px;margin-bottom:10px;}
.empty p{font-size:14px;line-height:1.7;}
.empty a{color:var(--accent);text-decoration:none;font-weight:600;}

.toast{position:fixed;bottom:24px;right:24px;background:#323232;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;transform:translateY(0);}
.media-table-wrap{margin-bottom:28px;overflow-x:auto;}
.media-table{width:100%;border-collapse:collapse;font-size:13px;}
.media-table th{background:#f5f6fa;color:#555;font-weight:600;padding:10px 14px;text-align:center;border-bottom:2px solid #e8eaf0;white-space:nowrap;}
.media-table th:first-child{text-align:left;}
.media-table td{padding:11px 14px;text-align:center;border-bottom:1px solid #f0f1f7;color:var(--navy);}
.media-table td:first-child{text-align:left;font-weight:600;}
.media-table tr:last-child td{border-bottom:none;}
.media-table tr:hover td{background:#fafbff;}
.plat-badge-tbl{display:inline-flex;align-items:center;gap:6px;}
.plat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

/* ── 차트 필터 ── */
.er-filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.er-filter-btn{padding:6px 16px;border-radius:20px;border:1px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;background:#f5f6fa;color:#666;transition:all .15s;}
.er-filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.chart-duo{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.chart-duo-box{background:var(--white);border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.chart-duo-title{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:12px;text-align:center;}
@media(max-width:700px){.chart-duo{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <a href="kol_index.html" class="hbtn">← 홈</a>
    <h1>정량 분석</h1>
    <a href="exolyt_parser.html" class="hbtn">+ 데이터 추가</a>
    <span class="badge" id="totalBadge">0개</span>
  </div>
  <div class="qtabs">
    <button class="qtab-btn active" id="qtabBtn1" onclick="switchQuantTab(1)">정량 분석 RD</button>
    <button class="qtab-btn"        id="qtabBtn2" onclick="switchQuantTab(2)">상세 분석 (매체/브랜드별)</button>
  </div>
</div>

<div class="main">

<div id="qtab1" class="qtab-content active">

  <!-- ── 조건값 설정 (한 줄) ── -->
  <div class="filter-bar">
    <span class="fb-title">조건값 설정</span>

    <div class="fb-group">
      <span class="fb-label">조회수</span>
      <input class="fb-input" id="fViewsMin" type="number" min="0" placeholder="최소">
      <span class="fb-sep">~</span>
      <input class="fb-input" id="fViewsMax" type="number" min="0" placeholder="최대">
    </div>

    <div class="fb-divider"></div>

    <div class="fb-group">
      <span class="fb-label">ER(좋아요)≥</span>
      <input class="fb-input" id="fErL" type="number" min="0" max="100" step="0.1" value="" placeholder="0">
      <span class="fb-unit">%</span>
    </div>

    <div class="fb-group">
      <span class="fb-label">ER(댓글)≥</span>
      <input class="fb-input" id="fErC" type="number" min="0" max="100" step="0.1" value="" placeholder="0">
      <span class="fb-unit">%</span>
    </div>

    <div class="fb-group">
      <span class="fb-label">ER(공유)≥</span>
      <input class="fb-input" id="fErS" type="number" min="0" max="100" step="0.1" value="" placeholder="0">
      <span class="fb-unit">%</span>
    </div>

    <div class="fb-group">
      <span class="fb-label">ER(저장)≥</span>
      <input class="fb-input" id="fErB" type="number" min="0" max="100" step="0.1" value="" placeholder="0">
      <span class="fb-unit">%</span>
    </div>

    <button class="btn-accent" onclick="applyCondFilter()">필터링</button>
    <button class="btn-ghost" onclick="clearCondFilter()">해제</button>
    <span class="fb-active" id="fbActive">● 적용 중</span>
  </div>

  <!-- ── 통계 카드 (6개, 필터 반응형) ── -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="lbl">총 영상 수</div>
      <div class="val" id="stTotal">0</div>
      <div class="sub" id="stTotalSub"></div>
    </div>
    <div class="stat-card">
      <div class="lbl">평균 조회수</div>
      <div class="val" id="stViews">—</div>
    </div>
    <div class="stat-card">
      <div class="lbl">평균 ER(좋아요)</div>
      <div class="val" id="stErL">—</div>
    </div>
    <div class="stat-card">
      <div class="lbl">평균 ER(댓글)</div>
      <div class="val" id="stErC">—</div>
    </div>
    <div class="stat-card">
      <div class="lbl">평균 ER(공유)</div>
      <div class="val" id="stErS">—</div>
    </div>
    <div class="stat-card">
      <div class="lbl">평균 ER(저장)</div>
      <div class="val" id="stErB">—</div>
    </div>
  </div>

  <!-- ── 툴바 ── -->
  <div class="toolbar">
    <div class="toolbar-left">
      <input class="filter-box" id="searchInput" placeholder="🔍 핸들 검색..." oninput="applySearch()" style="width:200px">
      <select class="filter-box" id="brandFilter" onchange="applySearch()" style="width:130px">
        <option value="">전체 브랜드</option>
      </select>
      <select class="filter-box" id="platformFilter" onchange="applySearch()" style="width:110px">
        <option value="">전체 매체</option>
      </select>
    </div>
    <div class="col-picker" id="colPicker">
      <button class="col-picker-btn" id="colPickerBtn" onclick="toggleColDd()">
        컬럼 선택 <span class="arr">▼</span>
      </button>
      <div class="col-dropdown" id="colDd">
        <div class="col-dd-head">
          <span>컬럼 설정</span>
          <span onclick="selectAllCols(true)">전체</span>&nbsp;
          <span onclick="selectAllCols(false)">해제</span>
        </div>
        <div id="colCheckboxes"></div>
      </div>
    </div>
    <button class="btn-success" onclick="downloadCSV()">⬇ CSV</button>
    <button class="btn-danger" onclick="confirmClearAll()">🗑 전체 삭제</button>
  </div>


  <!-- ── 테이블 ── -->
  <div class="table-section">
    <div class="table-wrap">
      <table id="mainTable">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div id="emptyState" class="empty" style="display:none">
      <div class="icon">📭</div>
      <p>저장된 데이터가 없습니다.<br>
        <a href="exolyt_parser.html">데이터 추출</a>에서 파싱 후 <strong>정량 분석 데이터로 저장</strong>을 눌러주세요.</p>
    </div>
  </div>
</div><!-- /qtab1 -->

<!-- ══════════════ TAB 2: 상세 분석 ══════════════ -->
<div id="qtab2" class="qtab-content">
  <div id="detailEmpty" class="detail-empty" style="display:none">
    데이터가 없습니다. 먼저 RD 탭에서 데이터를 불러오세요.
  </div>
  <div id="detailContent">
    <div class="detail-section">
      <div class="detail-title">매체 상세</div>
      <div class="data-note" id="detailDataNote"></div>
      <div class="media-table-wrap" id="mediaSummaryRow"></div>
      <div class="er-filter-bar" id="erFilterBar">
        <button class="er-filter-btn active" onclick="setErFilter('erL')">좋아요</button>
        <button class="er-filter-btn" onclick="setErFilter('erC')">댓글</button>
        <button class="er-filter-btn" onclick="setErFilter('erS')">공유</button>
        <button class="er-filter-btn" onclick="setErFilter('erB')">저장</button>
      </div>
      <div class="chart-duo">
        <div class="chart-duo-box">
          <div class="chart-duo-title">Instagram</div>
          <canvas id="chartIG"></canvas>
        </div>
        <div class="chart-duo-box">
          <div class="chart-duo-title">TikTok</div>
          <canvas id="chartTT"></canvas>
        </div>
      </div>
    </div>
  </div>
</div><!-- /qtab2 -->
</div>

<div id="toast" class="toast"></div>

<script>
// ════════ 컬럼 정의 ════════
const COLS=[
  {key:'brand',   label:'브랜드',     num:false,sortFn:r=>r.brand},
  {key:'platform', label:'매체',       num:false,sortFn:r=>r.platform},
  {key:'handle',  label:'핸들',       num:false,sortFn:r=>r.handle},
  {key:'url',     label:'링크',       num:false,sortFn:null},
  {key:'caption', label:'피드문구',   num:false,sortFn:r=>r.caption},
  {key:'date',    label:'업로드일',   num:false,sortFn:r=>r.date},
  {key:'country', label:'국가',       num:false,sortFn:r=>r.country},
  {key:'views',   label:'조회수',     num:true, sortFn:r=>r.viewsN},
  {key:'likes',   label:'좋아요',     num:true, sortFn:r=>r.likesN},
  {key:'comments',label:'댓글',       num:true, sortFn:r=>r.commentsN},
  {key:'shares',  label:'공유',       num:true, sortFn:r=>r.sharesN},
  {key:'saves',   label:'저장',       num:true, sortFn:r=>r.savesN},
  {key:'erL',     label:'ER(좋아요)', num:true, sortFn:r=>erN(r.likesN,r.viewsN)},
  {key:'erC',     label:'ER(댓글)',   num:true, sortFn:r=>erN(r.commentsN,r.viewsN)},
  {key:'erS',     label:'ER(공유)',   num:true, sortFn:r=>erN(r.sharesN,r.viewsN)},
  {key:'erB',     label:'ER(저장)',   num:true, sortFn:r=>erN(r.savesN,r.viewsN)},
  {key:'promo',   label:'프로모션여부',num:false,sortFn:r=>r.promo},
  {key:'_del',    label:'',           num:false,sortFn:null,fixed:true}
];
const DEF_VIS={brand:true,platform:true,handle:true,url:true,caption:true,date:true,country:true,
  views:true,likes:true,comments:true,shares:true,saves:true,
  erL:true,erC:false,erS:false,erB:false,promo:true,_del:true};
let colVis={...DEF_VIS};

// ════════ 상태 ════════
let allRows=[], condRows=[], filtered=[];
let sortState={col:-1,asc:true};
let condActive=false;

// ════════ 유틸 ════════
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function fmtN(n){if(!n||n<1)return String(n||0);if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return Math.round(n).toLocaleString();}
function erN(num,views){return(views&&num)?num/views*100:0;}
function erFmt(num,views){const v=erN(num,views);return v>0?v.toFixed(2)+'%':'—';}
function erCls(p){return p>=3?'er-hi':p>=1?'er-mid':'er-lo';}
function avg(arr,fn){return arr.length?arr.reduce((s,r)=>s+fn(r),0)/arr.length:0;}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}

// ════════ 조건 필터 ════════
function applyCondFilter(){
  const vMin = parseFloat(document.getElementById('fViewsMin').value)||0;
  const vMax = parseFloat(document.getElementById('fViewsMax').value)||Infinity;
  const erLMin = parseFloat(document.getElementById('fErL').value)||0;
  const erCMin = parseFloat(document.getElementById('fErC').value)||0;
  const erSMin = parseFloat(document.getElementById('fErS').value)||0;
  const erBMin = parseFloat(document.getElementById('fErB').value)||0;

  condRows = allRows.filter(r=>{
    const v=r.viewsN||0;
    if(v < vMin || v > vMax) return false;
    if(erLMin > 0 && erN(r.likesN,v)    < erLMin) return false;
    if(erCMin > 0 && erN(r.commentsN,v) < erCMin) return false;
    if(erSMin > 0 && erN(r.sharesN,v)   < erSMin) return false;
    if(erBMin > 0 && erN(r.savesN,v)    < erBMin) return false;
    return true;
  });
  condActive=true;
  document.getElementById('fbActive').classList.add('on');
  applySearch();
  showToast(`✅ ${condRows.length}개 필터링됨`);
}

function clearCondFilter(){
  condRows=[...allRows]; condActive=false;
  document.getElementById('fbActive').classList.remove('on');
  // 입력값 초기화
  ['fViewsMin','fViewsMax','fErL','fErC','fErS','fErB'].forEach(id=>{document.getElementById(id).value='';});
  applySearch();
  showToast('필터링 해제됨');
}

// ════════ 검색 필터 ════════
function applySearch(){
  const q        = document.getElementById('searchInput').value.toLowerCase();
  const brand    = document.getElementById('brandFilter').value;
  const platform = document.getElementById('platformFilter').value;
  filtered  = condRows.filter(r=>{
    const mQ        = !q        || r.handle.toLowerCase().includes(q);
    const mBrand    = !brand    || r.brand === brand;
    const mPlatform = !platform || (r.platform||'TikTok') === platform;
    return mQ && mBrand && mPlatform;
  });
  sortState={col:-1,asc:true};
  document.querySelectorAll('#thead th').forEach(th=>th.classList.remove('asc','desc'));
  updateStats();
  renderTable(filtered);
  if(document.getElementById("qtab2")?.classList.contains("active")) buildDetailCharts();
}

// ════════ 데이터 로드 ════════
function updatePlatformFilter(){
  const platforms=[...new Set(allRows.map(r=>r.platform||'TikTok').filter(Boolean))].sort();
  const sel=document.getElementById('platformFilter');
  const cur=sel.value;
  sel.innerHTML='<option value="">전체 매체</option>'+platforms.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');
  if(platforms.includes(cur))sel.value=cur;
}

function updateBrandFilter(){
  const brands=[...new Set(allRows.map(r=>r.brand).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
  const sel=document.getElementById('brandFilter');
  const cur=sel.value;
  sel.innerHTML='<option value="">전체 브랜드</option>'+brands.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('');
  if(brands.includes(cur))sel.value=cur;
}

education #stylistsupportingstylists #behindthechair #hairextensionmasters #ittakesapro #hairstylistcoach #saloneducator #modernsalon #olaplex #rivertonutah", "date": "2024-06-06", "country": "", "views": "3.8M", "viewsN": 3800000, "likes": "16.8K", "likesN": 16800, "comments": "452", "commentsN": 452, "shares": "0", "sharesN": 0, "saves": "0", "savesN": 0}, {"brand": "Olaplex", "platform": "Instagram", "handle": "@Nadiya Issa", "url": "https://www.instagram.com/reel/C7FpuPKLhj6", "caption": "I get asked all the time how do I avoid shrinkage and let’s be real, YOU CAN’T 😂. Shrinkage is what our hair is suppose to do and consider your hair in good state when it does. Now this is how I stretch my days out before it completely shrinks: 1. Everything starts off with wash day. This time I used @olaplex Bond Maintenance line to cleanse my hair. And then I did two braids. Keep your hair tucked away until you’re ready to take it out. 2. Depending on the heat I get about 1-2 days with stretch hair. Your pic is your best friend. After the first take down I use a pic to stretch it out. 3. At night I opt for a low stretch ponytail or two big twist. I AVOID the pineapple method. Once I put my hair up it will literally stay there and it’s over(just happened) 😭😭 5. I use @hairloks moisture mist in between the days to keep my hair hydrated. This makes it easier to pick my hair out after a few days or use a blow dryer on cool to help stretch. The bottom line is you can’t avoid shrinkage, I just delay the process with doing this, lol. What do you with your hair while on vacation? . . . . . . . #teamnaturalhair #kinkyhair #type4hair #naturalhairloves #naturalhairblogger #4chair #naturalhairstyles #naturalhaircommunity #healthy_hair_journey #twistoutstyle #respectmyhair #naturalhairroutine #afrohair #nycinfluencer #naturallyshesdope #myhaircrush #blackmodelnaturalhair #naturalhaircaretips #hair2mesmerize #washdayroutine #afroprincesses #naturalhairgrowth #afrohairstyles", "date": "2024-05-18", "country": "", "views": "1.7M", "viewsN": 1700000, "likes": "18.8K", "likesN": 18800, "comments": "254", "commentsN": 254, "shares": "0", "sharesN": 0, "saves": "0", "savesN": 0}, {"brand": "Olaplex", "platform": "Instagram", "handle": "@Phoenix Hair Stylist • Razor Cut Specialist", "url": "https://www.instagram.com/reel/C5vyR32R2Xu", "caption": "Ever struggle trying to style your shag haircut? Well I’m here to tell ya it’s ALL ABOUT SET UP!! I promise styling is so easy and you only need about 5 minutes after your shower to set your hair up for the perfect style without using any hot tools!! I start off by cleansing my hair with @cultandking cream pop for that perfect clean but second day hair feeling ✨ Once I slightly towel dry my hair I then hop right into product. I truly feel like your product can also make or break how your style looks. You don’t need much but love to look at product as a TOOL to achieve my desired look. My top 3 products I use in my hair regularly are @cultandking jelly for the perfect hold element and love the bit of salt suspension that adds perfect texture to my wave without making it feel dry or brittle. I then pair that with @innersenseorganicbeauty quiet calm curl control for added hydration and little bit more control for my hair. My hair is fine and can tend ti get a little frizzy and quiet calm helps so much with frizz reduction without feeling heavy! And then I always use one pump of @olaplex #6 to keep my color treated hair healthy and strong! After I apply all my product I simply brush my hair into place and add some twists to help tell my wave where I want it to life and help support the curl structure. Once I have everything where I want it I let that shit AIR DRY!! After my hair gets 98% dry I then scrunch out any bit of cast left behind by product and BAM! I’m ready to go for the week 😎🧡🧡 • • • #tempeaz #shaghaircut #shagstyle #mullet #hairstyling #hairstylist #azhairstylist #azhair #phoenixhairstylist #phoenixhair #arizonahairstylist #azhair", "date": "2024-04-14", "country": "", "views": "1.4M", "viewsN": 1400000, "likes": "74.0K", "likesN": 74000, "comments": "662", "commentsN": 662, "shares": "0", "sharesN": 0, "saves": "0", "savesN": 0}, {"brand": "Olaplex", "platform": "Instagram", "handle": "@julia ann 🧚‍♀️", "url": "https://www.instagram.com/reel/C30U4UwuggX", "caption": "my curly styling routine!! as you’ve probably noticed, i’ve added a couple of things to my routine, which has not only enhanced my curls, but has made them last much longer in harsher conditions to start off the products i used are below: - shampoo and conditioner: prose - brush: bounce curl - curl cream: prose again lol - gel: in shower style fixer by curlsmith - diffuser and microfiber towel: both by curlsmith - hairspray: tresemme - oil: also prose lol i do wanna say, if im not using my prose curl cream, the style fixer gel, or the prose oil i’m probably using my lush curl cream, the curlsmith shine gel, and the olaplex number 7 oil. i tend to flip flop these products because i find if i use one or the other too often my curls get wonky, so flipping out the products work great! i’ll make a vid on this soon dw let’s talk about a few of the changes i’ve made in my routine: - i’ve consistently been using my bounce curl styling brush to clump my curls, i’m absolutely obsessed with this brush, as my hair has been getting longer i’ve needed a bit more help evenly distributing the product through my hair and this brush just does it perfectly - i apply a cream first, then use my brush, glaze over gel, then scrunch, i used to just scrunch but taking the time and doing a few extra steps have made my curls look so much better and last so much longer - the hairspray trick has helped me so much for getting my curls to stay intact, as i’ve mentioned, i work in a greenhouse and i’m constantly moving around and the humidity definitely does a number on my curls, so i think it’s pretty impressive that i can go pretty esN": 86400, "comments": "653", "commentsN": 653, "shares": "0", "sharesN": 0, "saves": "0", "savesN": 0}, {"brand": "K18", "platform": "Instagram", "handle": "@Gerilyn Orlando Vivids/extensions💋", "url": "https://www.instagram.com/reel/C5etLZkOuoS", "caption": "VIVIDS ARE A LUXURY.💯 . AND SO ARE EXTENSIONS! All day project and I love it! Nothing makes me more satisfied than a transformation of any kind. On my girl Lindsey I started with removal of her extensions then with a fresh lift with BLONDME. I of course used @k18hair for my bonder. Then I installed her @dreamcatchershair wefts that she’s had for about 8months and they are still in great condition. ❤️ We did 3 rows 2 no-show rows and a top row to blend that cap you can sometimes get if it’s not high enough. . LUXURY VIVIDS coming in with @dangerjonescreative color For this majestic, siren, rainbow, prism. . All of this cost $1300 not including the hair, which she already had and I will throw in a weft or two here and there when needed. She is always down for content creating, so I’m super grateful for that. Let me know your thoughts on luxury vivids, and luxury hair. . Hair by me #gerilynghaisarzadeh #ggsvividluxe #luxuryvivids #dreamluxe #dreamcatchershairextensions #dreamcatcherseducator #dangerjonescreative #behindthechair_com #rainbowprism #k18 #schwarzkopfusa #orlandovivids #orlandoextensions #orlandoluxuryhair #tealhaircolor #weftextensions #orlandohaircolorist #capricciriccicollegepark #hairextensionmasters #vividhaircolor #extensioninstall #luxuryhaircolor", "date": "2024-04-08", "country": "", "views": "1.7M", "viewsN": 1700000, "likes": "12.1K", "likesN": 12100, "comments": "337", "commentsN": 337, "shares": "0", "sharesN": 0, "saves": "0", "savesN": 0}, {"brand": "K18", "platform": "Instagram", "handle": "@CAMILE GHORAYEB /OHIO BALAYAGE SPECIALIST", "url": "https://www.instagram.com/reel/C8qBqyENDS0", "caption": "Since last November was her last visit ✨ my client she is not ready to go all way natural and doesn’t want color every 4 weeks so I recommend for her color gloss every 8 to 10 weeks and lighting every 6 months ✨ @redken #flashliftbonderinside 20 volume Between foil 07nb shadesq last 30 minutes Lift to level 9 Root tap 07t 07na 07v All over 09m 09t 09v @k18hair mist mask Watch all the way and let me know what you think 💭 #blendgrays #livedincolor #mastersofbalayage #lovehair #healthyhair #clevelandbalayage #ohiobalayage #luxuryhair #bekind #behindthechair #k18 #redkenobsessed @behindthechair_com @mastersofbalayage @american_salon @beautylaunchpad", "date": "2024-06-26", "country": "", "views": "1.2M", "viewsN": 1200000, "likes": "324", "likesN": 324, "comments": "84", "commentsN": 84, "shares": "0", "sharesN": 0, "saves": "0", "savesN": 0}, {"brand": "K18", "platform": "Instagram", "handle": "@DARIAN D x BOSTON STYLIST", "url": "https://www.instagram.com/reel/DK-pTA9S8nb", "caption": "Please remember people are humans, and don’t leave bad comments towards the prior stylist I will delete them💕 we don’t know what someone could have going on! Today was a trip, I thought I was going to have a boring ol’ Monday. Until my color consultation walked in like this 🥴 (no, this tragedy was not my doing) There were bleed marks everywhere, random dark spots, random foil spots, orange roots, damaged hair, uneven hair cut and just absolute insanity. I had TWO hours only to do SOMETHING to this and dang we did it. I color melted her root with 40g of 7.0 and 20g of 8.00 and 10vol I then thew in a few quick panels of balayage to make sure I kept her feeling bright with adding so much darkness to the root, and popped a few baby lights and baby lowlights around the hairline to tie everything together and break up the hotspots. I globally toned her using 7.GM+9GM equal parts using all @elevenaustralia @elevenaustraliapro hair color & lightener. (Eleven I love you so much) Then I finished with @k18hair to make sure she stayed as healthy as possible. DONT DOUBT k18 WE LOVE HER. The results were better than I anticipated especially with the time frame I was working with. To all my baby stylists (and stylists in general) honesty goes such a long way with clients, if you mess up, you are human, you’re allowed to have bad days. We all do. But let’s make sure our days aren’t impacted by decisions we make behind the chair and let’s make sure our clients leave feeling like we were honest with them 💕 Hopefully someday I’ll be able to tell yall the TEAAAAAA with this client and her experience with someone else but for now we’re gonna keep her anon 🫶 Happy fricken Monday yall P.s. MIND YA BUSINESS ABOUT THE BLUE COLOR SPOTS ON MY SWEATSHIRT Mondays idgaf. Love ya xoxo #botch #botchedhair #hairdisaster #colorcorrecting #colorcorrector #bostonstylist #navyyard #navyyardsalon #colorinspo #hair #hairfix #fix #blondie #haircolor", "date": "2025-06-17", "country": "", "views": "1.0M", "viewsN": 1000000, "likes": "30.1K", "likesN": 30100, "comments": "1.2K", "commentsN": 1200, "shares": "0", "sharesN": 0, "saves": "0", "savesN": 0}, {"brand": "K18", "platform": "Instagram", "handle": "@Jessica Phillips", "url": "https://www.instagram.com/reel/DRfc3W-kp5i", "caption": "insane color transformation: THE VIDEO. peep my last post for all of the details ☑️ deep wine red box color to ashy lived in blonde in one session 🪄 This is my new client Brittany. When I opened her current hair color photo and inspiration photo on her new client consultation form I was like “hell yeah” 🤘🏼 Consultations and price quotes are the most important part about a service like this. We don’t surprise clients with pricing or hidden charges in my chair, and I don’t invite somebody into my studio or book their first appointment without them having a deep understanding of the way I price my services including a ‘worst case scenario’ quote that would be the absolute mosttt a service like this would cost if god forbid everything went wrong every step of the way. When it comes to pricing- ya girl doesn’t play and I know my clients appreciate that about me. Anyway, I got right in with my oxidative color remover to start reversing the oxidation process of this BOX DARK RED haircolor. I did that remover the maximum of three times, finished with @k18hair clarifying shampoo and took her back to my chair for a blowdry. While the hair was about 80% dry, I applied the k18 molecular repair mist and let that sit for 4 minutes before completing her blowdry and beginning my full lightening service. I started by mixing @joico silver light lightener with 10 and 20 volume developer and began my application in the back of the head so that I could pull those out as the top processed. I continued through the head slightly raising the ratio of 20 volume to 10 volume so to keep the processing even throughout my application. Once I pulled all of the foils I took her back to the shampoo bowl for another round of k18 cleansing and then I brought her to my chair to evaluate her canvas at that point and to formulate the perfect tone for her desired end result. Ended up using my tried and true @Pravana express tones! Oh yeah, and I used @ruskhaircare ELIMIN8 har color remover from @marlobeautysupply 💋 questions? Just ask! 🖤 thank you for reading! #jessicaphillipshair #colorcorrection #mastercolorist #detroithair", "date": "2025-11-26", "country": "", "views": "1.0M", "viewsN": 1000000, "likes": "0", "likesN": 0, "comments": "99", "commentsN": 99, "shares": "0", "sharesN": 0, "saves": "0", "savesN": 0}, {"brand": "Colorwow", "platform": "Instagram", "handle": "@✿ Aliya Janae ✿", "url": "https://www.instagram.com/reel/DHZa-tDyovq", "caption": "1 hour wrapped into 1 min 🍒 using silk elements coconut heat protection spray! colorwow dream coat spray and olaplex no6 was used off video #hairroutine", "date": "2025-03-20", "country": "", "views": "9.5M", "viewsN": 9500000, "likes": "292.2K", "likesN": 292200, "comments": "917", "commentsN": 917, "shares": "0", "sharesN": 0, "saves" const COLS_VER='v3'; // 컬럼 변경 시 버전 번호 올리면 캐시 자동 초기화
function saveColVis(){
  localStorage.setItem('kolQuantCols',JSON.stringify(colVis));
  localStorage.setItem('kolQuantColsVer',COLS_VER);
}
function loadColVis(){
  try{
    const ver=localStorage.getItem('kolQuantColsVer');
    const raw=localStorage.getItem('kolQuantCols');
    if(raw && ver===COLS_VER){
      const s=JSON.parse(raw);
      colVis={...DEF_VIS,...s};
    } else {
      // 버전 불일치 → 기본값으로 리셋
      colVis={...DEF_VIS};
      saveColVis();
    }
  }catch(e){ colVis={...DEF_VIS}; }
}

// ════════ 헤더 빌드 ════════
function buildHeader(){
  const tr=document.createElement('tr');
  COLS.forEach((c,i)=>{
    const th=document.createElement('th');
    th.dataset.col=c.key;
    if(c.fixed){th.classList.add('no-sort');th.style.width='32px';}
    else if(c.sortFn){th.innerHTML=c.label+'<span class="si"></span>';th.onclick=()=>doSort(i);}
    else{th.textContent=c.label;th.classList.add('no-sort');}
    if(c.num)th.style.textAlign='right';
    if(!c.fixed&&!colVis[c.key])th.classList.add('col-hidden');
    tr.appendChild(th);
  });
  document.getElementById('thead').innerHTML='';
  document.getElementById('thead').appendChild(tr);
}

// ════════ 테이블 렌더 ════════
function cellHTML(c,r){
  const v=r.viewsN||0;
  switch(c.key){
    case 'brand':   return `<td data-col="brand" style="font-weight:600;color:#444">${esc(r.brand)||'—'}</td>`;
    case 'platform':{
      const pt=r.platform||'TikTok';
      const badge=pt==='Instagram'
        ?'<span style="background:#fce4ec;color:#c2185b;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px">IG</span>'
        :pt==='YouTube'
        ?'<span style="background:#ffebee;color:#c62828;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px">YT</span>'
        :'<span style="background:#e0f2f1;color:#00695c;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px">TT</span>';
      return `<td data-col="platform" style="text-align:center">${badge}</td>`;}
    case 'handle':  return `<td data-col="handle" class="handle">${esc(r.handle)}</td>`;
    case 'url':{const lnkLbl=r.platform==='Instagram'?'Instagram↗':'TikTok↗';return `<td data-col="url">${r.url?`<a class="vlink" href="${esc(r.url)}" target="_blank">${lnkLbl}</a>`:'—'}</td>`;}
    case 'caption': return `<td data-col="caption" class="caption-cell" title="${esc(r.caption)}">${esc(r.caption)||'—'}</td>`;
    case 'date':    return `<td data-col="date">${r.date||'—'}</td>`;
    case 'country': return `<td data-col="country">${esc(r.country)||'—'}</td>`;
    case 'views':   return `<td data-col="views" class="num">${r.views||'—'}</td>`;
    case 'likes':   return `<td data-col="likes" class="num">${r.likes||'—'}</td>`;
    case 'comments':return `<td data-col="comments" class="num">${r.comments||'—'}</td>`;
    case 'shares':  return `<td data-col="shares" class="num">${r.shares||'—'}</td>`;
    case 'saves':   return `<td data-col="saves" class="num">${r.savesVal||'—'}</td>`;
    case 'erL':{const p=erN(r.likesN,v);return `<td data-col="erL" class="num ${erCls(p)}">${erFmt(r.likesN,v)}</td>`;}
    case 'erC':  return `<td data-col="erC" class="num">${erFmt(r.commentsN,v)}</td>`;
    case 'erS':  return `<td data-col="erS" class="num">${erFmt(r.sharesN,v)}</td>`;
    case 'erB':  return `<td data-col="erB" class="num">${erFmt(r.savesN,v)}</td>`;
    case 'promo':return `<td data-col="promo" style="text-align:center">${r.promo==='Y'?'<span class="promo-y">Y</span>':'<span class="promo-n">N</span>'}</td>`;
    case '_del': return `<td data-col="_del"><button class="del-btn" onclick="deleteRow(${allRows.indexOf(r)})" title="삭제">✕</button></td>`;
    default:     return `<td data-col="${c.key}">—</td>`;
  }
}
function renderTable(rows){
  const empty=document.getElementById('emptyState');
  const tbody=document.getElementById('tbody');
  if(!rows.length){
    tbody.innerHTML=allRows.length?`<tr><td colspan="${COLS.length}" style="text-align:center;padding:32px;color:#bbb">조건에 맞는 데이터 없음</td></tr>`:'';
    empty.style.display=allRows.length?'none':'block';
    applyColVis();return;
  }
  empty.style.display='none';
  tbody.innerHTML=rows.map(r=>`<tr>${COLS.map(c=>cellHTML(c,r)).join('')}</tr>`).join('');
  applyColVis();
}

// ════════ 정렬 ════════
function doSort(ci){
  const ths=document.querySelectorAll('#thead th');
  if(sortState.col===ci)sortState.asc=!sortState.asc;else{sortState.col=ci;sortState.asc=true;}
  ths.forEach((th,i)=>{th.classList.remove('asc','desc');if(i===ci)th.classList.add(sortState.asc?'asc':'desc');});
  const fn=COLS[ci].sortFn;if(!fn)return;
  const sorted=[...filtered].sort((a,b)=>{const va=fn(a),vb=fn(b);return typeof va==='number'?(sortState.asc?va-vb:vb-va):(sortState.asc?String(va).localeCompare(String(vb),'ko'):String(vb).localeCompare(String(va),'ko'));});
  renderTable(sorted);
}

  document.getElementById('fbActive').classList.remove('on');

}

    return vis.map(c=>{
      switch(c.key){
        case 'platform': return r.platform||'TikTok';
        case 'brand':  return r.brand||'';
        case 'handle': return r.handle; case 'url':return r.url||'';
        case 'caption':return r.caption; case 'date':return r.date;
        case 'country':return r.country; case 'views':return r.views;
        case 'likes':return r.likes; case 'comments':return r.comments;
        case 'shares':return r.shares; case 'saves':return r.savesVal||'';
        case 'erL':return v?erN(r.likesN,v).toFixed(2)+'%':'';
        case 'erC':return v&&r.commentsN?erN(r.commentsN,v).toFixed(2)+'%':'';
        case 'erS':return v&&r.sharesN?erN(r.sharesN,v).toFixed(2)+'%':'';
        case 'erB':return v&&r.savesN?erN(r.savesN,v).toFixed(2)+'%':'';
        case 'promo':return r.promo; default:return '';
      }
    });
  });
  const csv='﻿'+[header,...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download=`kol_quant_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();showToast('⬇ CSV 다운로드');
}

// ════════ Enter 키로 필터링 ════════
document.querySelector('.filter-bar').addEventListener('keydown',e=>{
  if(e.key==='Enter') applyCondFilter();
});


// ════════ 퀀트 탭 전환 ════════
function switchQuantTab(n) {
  [1,2].forEach(i=>{
    document.getElementById('qtab'+i).classList.toggle('active', i===n);
    document.getElementById('qtabBtn'+i).classList.toggle('active', i===n);
  });
  if(n===2) buildDetailCharts();
}

// ════════ 상세 분석 ════════
const chartInst = {};

const PLAT_COLORS = {
  'TikTok':    { bg:'rgba(0,105,92,0.55)',   border:'#00695c' },
  'Instagram': { bg:'rgba(194,24,91,0.55)',  border:'#c2185b' },
};
function platColor(pt){ return PLAT_COLORS[pt]||{bg:'rgba(92,107,192,0.55)',border:'#5c6bc0'}; }

function buildDetailCharts() {
  const data = filtered.length ? filtered : allRows;
  const note = document.getElementById('detailDataNote');
  if(!data.length){
    document.getElementById('detailEmpty').style.display='block';
    document.getElementById('detailContent').style.display='none';
    return;
  }
  document.getElementById('detailEmpty').style.display='none';
  document.getElementById('detailContent').style.display='block';
  note.textContent = `기준 데이터: ${data.length}개 영상`;

  // 플랫폼 목록
  const platforms=[...new Set(data.map(r=>r.platform||'TikTok'))].sort();

  // ── 매체 요약 테이블 ──
  const tRows = platforms.map(pt=>{
    const rows=data.filter(r=>(r.platform||'TikTok')===pt);
    const n=rows.length;
    const avgV = avg(rows,r=>r.viewsN);
    const avgL = avg(rows,r=>erN(r.likesN,r.viewsN));
    const avgC = avg(rows,r=>erN(r.commentsN,r.viewsN));
    const avgS = avg(rows,r=>erN(r.sharesN,r.viewsN));
    const avgB = avg(rows,r=>erN(r.savesN,r.viewsN));
    const col  = platColor(pt);
    return `<tr>
      <td><span class="plat-badge-tbl"><span class="plat-dot" style="background:${col.border}"></span>${pt}</span></td>
      <td>${n}</td>
      <td>${fmtN(Math.round(avgV))}</td>
      <td>${avgL.toFixed(2)}%</td>
      <td>${avgC.toFixed(2)}%</td>
      <td>${avgS.toFixed(2)}%</td>
      <td>${avgB.toFixed(2)}%</td>
    </tr>`;
  }).join('');
  document.getElementById('mediaSummaryRow').innerHTML = `
    <table class="media-table">
      <thead><tr>
        <th>매체</th><th>콘텐츠 수</th><th>평균 조회수</th>
        <th>ER(좋아요)</th><th>ER(댓글)</th><th>ER(공유)</th><th>ER(저장)</th>
      </tr></thead>
      <tbody>${tRows}</tbody>
    </table>`;

  // ── 플랫폼별 산점도 2개 ──
  buildPlatCharts(data);
}

let currentErKey = 'erL';
const ER_META = {
  erL:{label:'ER(좋아요)', fn:r=>erN(r.likesN,r.viewsN)},
  erC:{label:'ER(댓글)',   fn:r=>erN(r.commentsN,r.viewsN)},
  erS:{label:'ER(공유)',   fn:r=>erN(r.sharesN,r.viewsN)},
  erB:{label:'ER(저장)',   fn:r=>erN(r.savesN,r.viewsN)},
};

function setErFilter(key){
  currentErKey=key;
  document.querySelectorAll('.er-filter-btn').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('onclick').includes("'"+key+"'"));
  });
  const data = filtered.length ? filtered : allRows;
  buildPlatCharts(data);
}

function buildPlatChart(canvasId, pt, data){
  const m = ER_META[currentErKey];
  const rows = data.filter(r=>(r.platform||'TikTok')===pt);
  const col  = platColor(pt);
  if(chartInst[canvasId]){ chartInst[canvasId].destroy(); delete chartInst[canvasId]; }
  if(!document.getElementById(canvasId)) return;
  const ctx = document.getElementById(canvasId).getContext('2d');
  chartInst[canvasId] = new Chart(ctx,{
    type:'scatter',
    data:{datasets:[{
      label: pt,
      data: rows.map(r=>({x:r.viewsN, y:m.fn(r), h:r.handle||''})),
      backgroundColor: col.bg,
      borderColor: col.border,
      borderWidth:1, pointRadius:5, pointHoverRadius:8,
    }]},
    options:{
      responsive:true,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:c=>{
          const p=c.raw;
          return `${p.h} | 조회수 ${fmtN(p.x)} | ${m.label} ${p.y.toFixed(2)}%`;
        }}},
      },
      scales:{
        x:{title:{display:true,text:'조회수',font:{size:11}}, ticks:{callback:v=>fmtN(v)}, grid:{color:'#f0f1f7'}},
        y:{title:{display:true,text:m.label,font:{size:11}}, ticks:{callback:v=>v.toFixed(1)+'%'}, grid:{color:'#f0f1f7'}},
      }
    }
  });
}

function buildPlatCharts(data){
  buildPlatChart('chartIG','Instagram',data);
  buildPlatChart('chartTT','TikTok',data);
}

// ════════ 초기화 ════════
loadColVis();
buildHeader();
buildColCbs();
loadData();
